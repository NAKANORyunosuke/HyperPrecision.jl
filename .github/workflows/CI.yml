name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "1.10"
            os: ubuntu-latest
            coverage: false
          - version: "1"
            os: ubuntu-latest
            coverage: true
          - version: "1"
            os: windows-latest
            coverage: false
          - version: "1"
            os: macos-latest
            coverage: false
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          check_bounds: "yes"
          coverage: ${{ matrix.coverage }}
          depwarn: "error"
      - if: matrix.coverage
        uses: julia-actions/julia-processcoverage@v1
      - if: matrix.coverage
        name: Add coverage to the job summary
        shell: bash
        run: |
          awk -F: '
            /^LF:/ { lines += $2 }
            /^LH:/ { hits += $2 }
            END {
              percentage = lines == 0 ? 0 : 100 * hits / lines
              printf "### Line coverage\n\n%d/%d lines (%.2f%%)\n", hits, lines, percentage
            }
          ' lcov.info >> "$GITHUB_STEP_SUMMARY"
      - if: matrix.coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error
          retention-days: 90
